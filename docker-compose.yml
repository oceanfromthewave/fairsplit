services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fairsplit
      POSTGRES_PASSWORD: fairsplit
      POSTGRES_DB: fairsplit
    ports:
      - "5432:5432"
    volumes:
      - fairsplit_pg:/var/lib/postgresql/data

volumes:
  fairsplit_pg:
